<!DOCTYPE html> <!-- kalau ini menggunakan html -->
<html> <!-- untuk membuka semua file yang ada di didalam dokumen html -->
<head> <!-- informasi halaman web -->
    <title>Latihan membuat HTML</title> <!-- judul halaman yang akan muncul dalam web -->
    <style>
        body {
    font-family: Arial, sans-serif; 
}
    </style>
  </head> 
<body> <!-- berisi tampilan yang akan tertampil di halam web -->

<table border="1" style="border-collapse: collapse; width: 60%;"> <!-- untuk membuat tabel, border 1 dengan ketebalan garis tabel, width digunakan untuk seberapa besar halman yang akan di gunakan -->
    
    <!-- HEADER -->
    <tr> <!-- digunakan untuk membuat 1 baris  -->
        <td colspan="2" align="center" height="60" style="background-color: rgb(216, 164, 97);" > <!-- td (tabel data),colspan 2 mengabungkan 2 kolom menjadi 1 karen terdapa t2 kolom yang digunakan, align="center" digunakan untuk centerkan tulisan, height="60 menentukan tinggi tabel -->
            
            HEADER <!-- tulisan yang akan tertampil -->
        </td>
    </tr>

    <!-- NAVIGASI -->
    <tr> <!-- digunakan untuk membuat 1 baris -->
        <td colspan="2" align="center" height="40" style="background-color: rgb(121, 218, 250);" > <!-- td (tabel data),colspan 2 mengabungkan 2 kolom menjadi 1 karen terdapa t2 kolom yang digunakan, align="center" digunakan untuk centerkan tulisan, height="60 menentukan tinggi tabel -->
            NAVIGASI <!-- tulisan yang akan tertampil -->
        </td>
    </tr>    

    <!-- KONTEN -->
    <tr>  <!-- digunakan untuk membuat 1 baris -->
        <td width="75%" height="300" style="padding: 40px; background-color: rgb(211, 76, 76);"> <!-- td (tabel data), widht untuk lebar tabel yang akan digunakan dari lebar tabel, height untuk tinggi tabel  --> 
            <h1>Heading 1</h1>  <!-- tulisan yang akan tertampil h1 untuk judul utama                                                                                                                                                                                                                                                                                                                                                   -->
            <p>
                Lorem ipsum dolor sit amet, consectetur <br><!-- tulisan yang akan tertampil p utnuk membuat paragraf -->
                adipiscing elit, sed do eiusmod tempor <br><!-- tulisan yang akan tertampil p utnuk membuat paragraf-->
                incididunt ut labore et dolore magna aliqua. <!-- tulisan yang akan tertampil p utnuk membuat paragraf-->
            </p>
        </td>

        <!-- MENU -->
        <td width="25%" style="background-color: rgb(4, 236, 54);"> <!--menggunakan 30% lebar tabel-->
            <b>Menu:</b> <!-- b membuat tulisan menjadi tebal  -->
            <ul> <!-- membuat tanda dengan tanda lingkaran -->
                <li>Home</li> <!-- li berarti list item tulisan yang akan tertampil -->
                <li>Berita</li> <!-- li berarti list item tulisan yang akan tertampil -->
                <li>Layanan</li> <!-- li berarti list item tulisan yang akan tertampil -->
                <li>Kontak</li> <!-- li berarti list item tulisan yang akan tertampil -->
            </ul>
        </td> 
    </tr>

    <!-- FOOTER -->
    <tr>
        <td colspan="2" align="center" height="40" style="background-color: rgb(216, 164, 97);"> <!-- td (tabel data),colspan 2 mengabungkan 2 kolom menjadi 1 karen terdapa t2 kolom yang digunakan, align="center" digunakan untuk centerkan tulisan, height="40 menentukan tinggi tabel -->
            FOOTER <!-- tulisan yang akan tertampil -->
        </td>
    </tr>

</table>

</body>
</html>
