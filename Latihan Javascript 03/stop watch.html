<!DOCTYPE html> 
<html>

<head> 
    <title>Second Stopwatch</title> <!-- Judul pada tab browser -->
</head> 

<body> 
    <h2>Second Stopwatch</h2> <!-- Menampilkan judul stopwatch -->
    <p id="display">0</p> <!-- Tempat menampilkan jumlah detik -->
    <button onclick="mulai()">Start</button> <!-- Tombol Start untuk menjalankan stopwatch -->
    <button onclick="berhenti()">Stop</button> <!-- Tombol Stop untuk menghentikan stopwatch -->
    <button onclick="reset()">Reset</button> <!-- Tombol Reset untuk mengembalikan waktu menjadi 0 -->
    
    <script> <!-- Membuka JavaScript -->
        let detik = 0; // Variabel untuk menyimpan jumlah detik
        let stopwatch; // Variabel untuk menyimpan timer dari setInterval
    
        function mulai() { // Membuat fungsi mulai yang dijalankan ketika tombol Start ditekan
            stopwatch = setInterval(function() { // Menjalankan fungsi setiap 1000 milidetik atau 1 detik
                detik++; // Menambahkan nilai detik sebanyak 1
                document.getElementById("display").innerHTML = detik; // Menampilkan nilai detik ke halaman HTML
            }, 1000);  // 1000 milidetik = 1 detik
        }

        function berhenti() {  // Membuat fungsi berhenti untuk menghentikan stopwatch
            clearInterval(stopwatch); // Menghentikan setInterval yang sedang berjalan
        }

        function reset() { // Membuat fungsi reset untuk mengembalikan stopwatch ke 0
            clearInterval(stopwatch); // Menghentikan stopwatc
            detik = 0; // Mengembalikan jumlah detik menjadi 0
            document.getElementById("display").innerHTML = detik; // Menampilkan angka 0 pada halaman
        }
    </script> 
</body> 
</html>
